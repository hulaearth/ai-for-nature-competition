name: "Backup: Choose or confirm final entry"
description: Use only if a conductor directs you to the GitHub backup route
title: "[Nomination] "
body:
  - type: markdown
    attributes:
      value: "BACKUP ONLY. Normally use Use for final beside an accepted entry in the main Space Submit tab. If a conductor asks you to use this backup, enter the accepted entry reference (HF-42, GH-42 or GitHub issue 42) without re-uploading the CSV. The latest valid choice before 17:30 wins. Do not edit this issue. Presentation upload remains a separate Google Form; keep its confirmation."
  - type: input
    id: team-slug
    attributes:
      label: Team slug
    validations:
      required: true
  - type: input
    id: submission-issue
    attributes:
      label: Submission reference
      description: An accepted entry belonging to your team, e.g. HF-42, GH-42 or 42.
    validations:
      required: true
  - type: textarea
    id: method-reference
    attributes:
      label: Method report and code/checkpoint reference
      description: Link the completed method report and exact reproducible source/checkpoint reference. Do not include keys or hidden labels.
    validations:
      required: true
  - type: textarea
    id: presentation-reference
    attributes:
      label: Presentation reference
      description: Submit the final PDF through the announced private presentation form before the deadline. Optionally identify that submission here by team slug and submission time; keep the slides in the form upload.
