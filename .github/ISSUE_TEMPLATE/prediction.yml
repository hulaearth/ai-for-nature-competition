name: "Backup: Final-test prediction"
description: Use only if a conductor directs you to the GitHub backup route
title: "[Prediction] "
body:
  - type: markdown
    attributes:
      value: "BACKUP ONLY. Normally upload the CSV directly in the main Space Submit tab: https://hulaearth-ai-for-nature-hula-earth.static.hf.space/index.html#submit . Use this issue only if a conductor asks you to. Encrypt with legacy-submit.html#submit first and attach only the downloaded .encrypted.json file. Never attach a raw CSV. Create a new issue for corrections; do not edit this issue."
  - type: input
    id: team-slug
    attributes:
      label: Team slug
      placeholder: habitat-heroes
    validations:
      required: true
  - type: textarea
    id: encrypted-file
    attributes:
      label: Encrypted prediction file
      description: Drag the .encrypted.json here and wait for its GitHub attachment link to appear before creating the issue.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Submission declaration
      options:
        - label: I am the approved uploader and these predictions follow the published permitted-data and validation rules.
          required: true
