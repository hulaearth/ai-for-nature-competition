name: Deploy static competition Space
on:
  workflow_dispatch:
    inputs:
      clean_participant_history:
        description: "Keep only current participant Space snapshot (organizer maintenance)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['site/**', '!site/worker-status.json', '!site/receipts.json', '!site/teams.json', '!site/leaderboard.json', '!site/config.json', 'config/**', '!config/challenge.json', 'scripts/content/**', 'scripts/build_site.py', 'scripts/deploy_space.py', 'scripts/hub_http.py', '.github/workflows/deploy-space.yml']
permissions:
  contents: read
concurrency:
  group: hf-static-space
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require explicit HF backup activation
        run: python3 scripts/backup_control.py --require runtime
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:submission
      - run: node --test tests/*.test.js
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/build_site.py && python3 scripts/check_site.py
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.HF_DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require explicit HF backup activation
        run: python3 scripts/backup_control.py --require runtime
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - run: python -m pip install huggingface-hub==2.2.0
      - name: Upload public allowlist only
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN || secrets.HF_TOKEN }}
          CLEAN_PARTICIPANT_HISTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_participant_history && 'true' || 'false' }}
        run: python scripts/deploy_space.py
