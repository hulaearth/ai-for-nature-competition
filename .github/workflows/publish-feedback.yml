name: Publish team and submission feedback
on:
  push:
    branches: [main]
    paths: ['site/receipts.json', 'site/leaderboard.json', 'site/teams.json', 'site/config.json']
  workflow_dispatch:
  schedule:
    - cron: '4-59/5 8-19 24 10 *'
permissions:
  contents: read
concurrency:
  group: hf-competition-feedback
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - run: python -m pip install huggingface-hub==2.2.0
      - name: Publish verified public JSON only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN || secrets.HF_TOKEN }}
        run: python scripts/publish_feedback.py
