name: Release participant materials at 10 German time
on:
  workflow_run:
    workflows: ['Deploy static competition Space']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Verify, open the explicitly approved GitHub inbox, or publish the starter at its guarded time
        type: choice
        options: [verify, publish, open-inbox]
        default: verify
  schedule:
    # 24 October 2026: 10:00 Europe/Berlin = 08:00 UTC.
    # Warm-up jobs wait for the guarded instant. Later triggers retry partial failures.
    - cron: '17,32,47 7 24 10 *'
    - cron: '2,7,12 8 24 10 *'
permissions:
  contents: read
concurrency:
  group: participant-materials-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - id: window
        run: python scripts/release_materials.py --mode window
      - if: steps.window.outputs.ready == 'true' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        run: python -m pip install huggingface-hub==2.2.0
      - name: Verify or release only the participant materials
        if: steps.window.outputs.ready == 'true' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN || secrets.HF_TOKEN }}
          MATERIALS_RELEASE_TOKEN: ${{ secrets.MATERIALS_RELEASE_TOKEN }}
          RELEASE_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode || 'verify' }}
        run: python scripts/release_materials.py --mode "$RELEASE_MODE"
