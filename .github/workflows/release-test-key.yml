name: Release test-data unlock key
on:
  push:
    branches: [main]
    paths: ['scripts/release_test_key.py', 'config/test-key-release.json', '.github/workflows/release-test-key.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Verify setup without publication, or publish with the time guard
        type: choice
        options: [verify, publish]
        default: verify
  schedule:
    # 24 October 2026: 13:30 Europe/Berlin = 11:30 UTC.
    # Warm up before release; retries are idempotent and year/date bounded in Python.
    - cron: '47 10 24 10 *'
    - cron: '2,17 11 24 10 *'
    - cron: '32,37,42 11 24 10 *'
permissions:
  # Only this guarded main-branch workflow writes the public event-key backup.
  contents: write
concurrency:
  group: test-input-key-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Require explicit HF backup activation
        run: python3 scripts/backup_control.py --require releases
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - id: window
        run: python scripts/release_test_key.py --mode window
      - if: steps.window.outputs.ready == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
        run: python -m pip install huggingface-hub==2.2.0
      - name: Verify or release the test-input identity
        if: steps.window.outputs.ready == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN || secrets.HF_TOKEN }}
          TEST_RELEASE_KEY: ${{ secrets.TEST_RELEASE_KEY || secrets.TEST_DATA_UNLOCK_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode || 'verify' }}
        run: python scripts/release_test_key.py --mode "$RELEASE_MODE"
